/* Mobile title screen: game identity, quiet landscape and one primary action. */
#squad-overlay[data-view=login]{padding:0;background:#101a2c}

[data-view=login] .squad-panel .start-game{position:absolute;left:14%;bottom:24%;width:72%;min-height:max(14cqw,56px);margin:0;border:1px solid #e5d0a066;border-radius:12px;font-size:max(4.6cqw,18px);font-weight:500;letter-spacing:.18em;box-shadow:0 8px 32px #0005,inset 0 1px #fff3}

.start-brand{position:absolute;top:19%;left:7%;right:7%;text-align:center;pointer-events:none;color:#eed9ac;text-shadow:0 3px 22px #061320}

.start-wordmark{display:block;font:500 8.8cqw/1.2 Georgia,serif;letter-spacing:.13em;padding-left:.13em;color:#f4e3bc}
.start-title{display:block;margin-top:3cqw;font:500 14cqw/1.3 "Noto Serif TC","PMingLiU",serif;letter-spacing:.3em;padding-left:.3em;color:#f0dfb4}
